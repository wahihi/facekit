name: facekit_core
description: >
  Flutter-free face-recognition pipeline (detection/alignment/embedding/
  matching/liveness) shared by the facekit Flutter SDK and facekit_cli.
  Not published — path dependency only.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.1.0
  meta: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
