name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      # BYOM embedding-model weights (arcface_buffalo_l, AdaFace, AuraFace's
      # .tflite, etc.) are deliberately not committed to the repo — the
      # tests that need real weights (test/embedding/face_embedder_smoke_test.dart,
      # test/pipeline/face_pipeline_smoke_test.dart) detect that and skip
      # gracefully instead of failing, so this doesn't need to fetch any
      # model first.

      - name: facekit package — pub get
        run: flutter pub get

      # blazeface_smoke_test.dart and face_landmarker_smoke_test.dart load
      # real, bundled (Apache 2.0) .tflite models through tflite_flutter,
      # which needs the native libtensorflowlite_c.so — that's provided by
      # the Android/iOS runtime on a real device but isn't present on a
      # bare ubuntu-latest runner, so `flutter test` fails to even load the
      # interpreter here. Excluded from CI for that platform reason only;
      # both are verified for real via on-device testing (see
      # doc/KR/installation.md's "테스트 실행" section for detail).
      - name: facekit package — flutter test
        run: |
          flutter test $(find test -name '*_test.dart' \
            ! -name 'blazeface_smoke_test.dart' \
            ! -name 'face_landmarker_smoke_test.dart')

      - name: example app — pub get
        run: flutter pub get
        working-directory: example

      - name: example app — flutter test
        run: flutter test
        working-directory: example
