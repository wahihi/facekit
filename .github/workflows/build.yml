name: build

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # softprops/action-gh-release needs this to publish a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      # AuraFace's .tflite weight (~130MB) isn't committed to the repo — it
      # has to be fetched before building, or the resulting APK would
      # install but fail to load the embedding model at runtime. Runs from
      # the repo root (the default working-directory), unlike the
      # `example`-scoped steps below.
      - name: Fetch the AuraFace model weight
        run: bash tool/fetch_models.sh

      # The runnable app lives in example/, not the repo root — see
      # doc/EN/installation.md.
      - name: example app — pub get
        run: flutter pub get
        working-directory: example

      - name: example app — build release APK
        run: flutter build apk --release
        working-directory: example

      - name: Rename APK to include the version tag
        run: |
          mkdir -p dist
          cp example/build/app/outputs/flutter-apk/app-release.apk \
            "dist/facekit-example-${{ github.ref_name }}.apk"
          sha256sum "dist/facekit-example-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/facekit-example-${{ github.ref_name }}.apk
          # NOTE: this body is static — it's shown as-is on every future
          # tagged release until someone edits it again. Update the
          # "What's new" section before cutting the next tag.
          body: |
            Prebuilt release APK for facekit's example app (${{ github.ref_name }}).

            Ships with **AuraFace** (Apache 2.0) as the default embedding
            model — no manual model setup needed. Install directly on an
            Android device (minSdk 24 / Android 7.0+); see
            [doc/EN/installation.md](https://github.com/wahihi/facekit/blob/main/doc/EN/installation.md)
            (also [in Korean](https://github.com/wahihi/facekit/blob/main/doc/KR/installation.md))
            for what it does and how to build it from source instead.

            ## What's new in v0.1.3

            Adds a pose-quality gate to `AffineAligner`: if a frame's
            fitted alignment transform has a rotation beyond ±45° or a
            scale outside `[0.05, 3.0]` (both signs of a bad BlazeFace
            landmark fit, not a real face), it's now rejected before
            matching instead of being warped into a mostly-background crop
            and compared anyway.

            - This replaces trying to chase the problem via
              `matching.threshold` alone: three real-device rounds showed
              the observed genuine/impostor similarity margin shrinking as
              the sample grew (0.156 → 0.036 → 0.022), which pointed at
              alignment instability rather than an untuned threshold.
              `matching.threshold` is fixed back at 0.30 (the LFW-derived
              value from v0.1.2).
            - `FaceAligner.align()`'s return type changed to `AlignedFace?`
              accordingly (BYOM callers implementing the interface should
              handle `null` the same as "no face detected").
            - Real-device validation (self vs. a photo of someone else)
              found the gate correctly filters rotation-bad frames (55%
              rejected, 0 false triggers on scale) and did narrow the
              genuine/impostor gap — but also surfaced that a lot of that
              instability tracked with **backlighting**: a light source
              behind the subject degraded landmark precision. Avoid strong
              backlight for best results; a proper non-backlit
              re-measurement is a follow-up.

            Full write-up:
            [doc/EN/adaface_verification.md](https://github.com/wahihi/facekit/blob/main/doc/EN/adaface_verification.md#giving-up-on-threshold-tuning-in-favor-of-a-pose-gate-2026-08-11-continued)
            (also [in Korean](https://github.com/wahihi/facekit/blob/main/doc/KR/adaface_verification.md)).

            <details>
            <summary>v0.1.2 — AuraFace normalization fix</summary>

            Fixed AuraFace being unable to tell two different people apart:
            an enrolled user and an unrelated person's photo were scoring
            almost the same similarity (~0.9 both). The cause was
            `example/assets/models/auraface/manifest.json`'s
            `input.normalize`, which fed raw 0–255 pixels in instead of the
            standard ArcFace `(pixel-127.5)/127.5` normalization the
            official `insightface` package's own loader auto-selects for
            this exact model graph. Re-measured genuine/impostor separation
            on 200 real LFW pairs (same methodology as ArcFace/AdaFace):
            EER 10.0%, and `matching.threshold` updated from an unvalidated
            0.40 placeholder to the measured 0.30. Full write-up:
            [doc/EN/postmortem/2026-08-09-auraface-normalization.md](https://github.com/wahihi/facekit/blob/main/doc/EN/postmortem/2026-08-09-auraface-normalization.md)
            (also [in Korean](https://github.com/wahihi/facekit/blob/main/doc/KR/postmortem/2026-08-09-auraface-normalization.md)).

            </details>

            <details>
            <summary>v0.1.1 — AffineAligner fixes</summary>

            Fixed four stacked bugs in `AffineAligner` (the 5-point face
            alignment step run before every embedding) that produced a
            mis-rotated, mis-scaled crop under real camera conditions: an
            SVD sign bug and a missing covariance normalization in the
            Umeyama solver, a wrong camera-rotation quarter-turn for the
            front camera, and a reversed BlazeFace eye-index order plus a
            forced, geometrically wrong 5th landmark point. Full write-up:
            [doc/EN/postmortem/2026-08-03-affine-aligner-alignment.md](https://github.com/wahihi/facekit/blob/main/doc/EN/postmortem/2026-08-03-affine-aligner-alignment.md)
            (also [in Korean](https://github.com/wahihi/facekit/blob/main/doc/KR/postmortem/2026-08-03-affine-aligner-alignment.md)).

            </details>
