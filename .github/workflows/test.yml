name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      # BYOM embedding-model weights (arcface_buffalo_l, AdaFace, AuraFace's
      # .tflite, etc.) are deliberately not committed to the repo — the
      # tests that need real weights (test/embedding/face_embedder_smoke_test.dart,
      # test/pipeline/face_pipeline_smoke_test.dart) detect that and skip
      # gracefully instead of failing, so this doesn't need to fetch any
      # model first.

      - name: facekit package — pub get
        run: flutter pub get

      # The only test left in the outer package after the facekit_core
      # split (see doc/KR/linux_port_scope.md) — everything else moved to
      # packages/facekit_core/test/.
      - name: facekit package — flutter test
        run: flutter test

      # facekit_core is plain Dart (no Flutter dependency — that's the
      # whole point, see doc/KR/linux_port_scope.md), so it's tested with
      # `dart test`, not `flutter test`.
      #
      # blazeface_smoke_test.dart, yunet_smoke_test.dart, and
      # face_landmarker_smoke_test.dart load real, bundled (Apache 2.0)
      # .tflite models through TfliteFfiRunner, which needs the native
      # libtensorflowlite_c.so — that's not present on a bare ubuntu-latest
      # runner (no official prebuilt exists; see tflite_ffi_runner.dart /
      # bindings/bindings.dart), so `dart test` fails to even load the
      # interpreter here. Excluded from CI for that platform reason only;
      # verified for real via on-device testing (see
      # doc/KR/installation.md's "테스트 실행" section for detail).
      - name: facekit_core package — pub get
        run: dart pub get
        working-directory: packages/facekit_core

      - name: facekit_core package — dart test
        run: |
          dart test $(find test -name '*_test.dart' \
            ! -name 'blazeface_smoke_test.dart' \
            ! -name 'yunet_smoke_test.dart' \
            ! -name 'face_landmarker_smoke_test.dart')
        working-directory: packages/facekit_core

      - name: example app — pub get
        run: flutter pub get
        working-directory: example

      - name: example app — flutter test
        run: flutter test
        working-directory: example
